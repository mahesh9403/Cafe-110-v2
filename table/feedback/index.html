<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="text-scale" content="scale" />
  <title>Anonymous Feedback — Cafe OneTen</title>
  <meta name="description" content="Tell us how we did at Cafe OneTen. Anonymous and takes under a minute." />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1C120A" />
  <meta name="format-detection" content="telephone=yes" />
  <link rel="icon" type="image/svg+xml" href="/img/favicon/favicon.svg?v=2611" />
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon/favicon-32.png?v=2611" />
  <link rel="apple-touch-icon" sizes="180x180" href="/img/favicon/apple-touch-icon.png?v=2611" />
  <link rel="manifest" href="/manifest.json?v=2611" />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/cormorant-garamond-500.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/jost-400.woff2" crossorigin />
  <link rel="stylesheet" href="/css/table.css?v=2611j" />
</head>
<body class="tbl">

<div class="tbl-wrap">

  <!-- SHARED TABLE HEADER (sub-page variant) — see css/table.css -->
  <header class="tbl-header">
    <a href="/" class="tbl-logo" aria-label="Cafe OneTen home">
      <img src="/img/logo/oneten-white-logo.webp?v=2611" alt="Cafe OneTen" width="800" height="254" />
    </a>
    <a class="tbl-back" href="/table/">&larr; Back</a>
  </header>

  <main id="content">
    <div id="fb-main">
      <div class="fb-intro">
        <h1>How did we do?</h1>
        <p>Anonymous and takes under a minute. 1 is lowest, 10 is highest.</p>
      </div>

      <form id="fb-form" novalidate>
        <!-- Honeypot: real guests never see or fill #fb-website; bots usually do. -->
        <div style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden" aria-hidden="true"><label for="fb-website">Website</label><input id="fb-website" type="text" tabindex="-1" autocomplete="off" /></div>

        <!-- All questions render here from FEEDBACK.questions in js/table.js.
             To change a question, edit that ONE config block — see _data/feedback/README.md. -->
        <ul class="fb-list" id="fb-questions"></ul>

        <noscript>
          <p class="fb-noscript">Leaving feedback needs JavaScript turned on. Please enable it, or ask our staff — we'd still love to hear from you.</p>
        </noscript>
      </form>
    </div>

    <!-- Thank-you screen -->
    <div class="fb-thanks" id="fb-thanks" hidden>
      <svg class="ring" viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="40" cy="40" r="30" />
        <path d="m27 41 9 9 18-20" />
      </svg>
      <h1 tabindex="-1">Thank you!</h1>
      <p>Your feedback helps us serve you better. We hope to see you again soon.</p>
      <a class="back-btn" href="/table/">Back to your table</a>
    </div>

  </main>
</div>

<!-- Sticky submit bar -->
<div class="fb-submitbar" id="fb-submitbar">
  <div class="inner">
    <p class="fb-count" id="fb-count" aria-live="polite">0 of 5 rated</p>
    <button type="submit" form="fb-form" class="fb-submit" id="fb-submit" disabled>
      Submit
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg>
    </button>
  </div>
</div>

<script src="/js/table.js?v=2611i" defer></script>
</body>
</html>
